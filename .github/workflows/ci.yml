name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '24'
  DO_NOT_TRACK: '1'

jobs:
  static:
    name: Static analysis, unit tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: ESLint
        run: npm run lint
      - name: Steiger (FSD)
        run: npm run lint:fsd
      - name: Prettier
        run: npm run format:check
      - name: Unit + component tests
        run: npm run test:coverage
      - name: Build
        run: npm run build
        env:
          VITE_SUPABASE_URL: http://127.0.0.1:54321
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci-build-placeholder
      - name: No privileged keys in bundle
        run: |
          if grep -rEl 'sb_secret_[A-Za-z0-9_-]{8,}|service_role' dist/; then
            echo "::error::Privileged Supabase key material found in dist/"; exit 1
          fi
      - name: Dependency audit
        run: npm run audit

  supabase:
    name: Database, integration, E2E (local Supabase)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: static
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Start local Supabase (ephemeral, in runner)
        run: npx supabase start -x studio,mailpit,imgproxy,logflare,vector,supavisor,edge-runtime,realtime,storage-api
      - name: Migration lint
        run: npm run db:lint
      - name: pgTAP (schema, RLS, privileges)
        run: npm run test:db
      - name: Integration tests (real Supabase)
        run: npm run test:integration
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: E2E + accessibility
        run: npm run test:e2e
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
      - name: Stop Supabase
        if: always()
        run: npx supabase stop --no-backup
